name: Feature Request
description: Propose new behaviour or an improvement
title: "feat(<scope>): <short summary>"
labels: ["enhancement", "status:needs-review"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched the existing issues and this is not a duplicate
          required: true
        - label: I understand this issue needs the status:approved label before a pull request can be opened
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem description
      description: The situation this solves, from the point of view of whoever hits it.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How it should behave. Describe what the user sees, not the implementation.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Backup and restore
        - Grading and rubrics
        - Web services
        - Scheduled tasks and queue
        - User interface
        - Privacy and data protection
        - Language strings
        - CI and workflows
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, or the workaround in use today.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, references, related issues.
